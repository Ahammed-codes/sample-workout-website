<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setwise – Workout Planner</title>
<style>
:root{--bg:#eef2f0;--ink:#16221d;--mut:#5d6b64;--card:#fff;--ln:#d2dbd6;--ac:#1f6f5c;--ac2:#e9f3ef;--warn:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101815;--ink:#e6efeb;--mut:#92a39b;--card:#18231f;--ln:#2b3a34;--ac:#5fc4a8;--ac2:#1d2e28;--warn:#e98a73}}
:root[data-theme=dark]{--bg:#101815;--ink:#e6efeb;--mut:#92a39b;--card:#18231f;--ln:#2b3a34;--ac:#5fc4a8;--ac2:#1d2e28;--warn:#e98a73}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bahnschrift","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:2.2rem}main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
nav{display:flex;gap:6px;margin:14px 0 20px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--card);padding:8px 14px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:3px 9px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button.on{background:var(--ac2);color:var(--ink);border-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{border-top:1px solid var(--ln);padding:10px 0}.ex:first-of-type{border-top:0}
.ex .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.m{color:var(--mut);font-size:.88rem}.ss{border-left:3px solid var(--ac);padding-left:8px}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sets input{width:64px;padding:5px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.note{background:var(--ac2);border-radius:8px;padding:8px 10px;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left}
@media(max-width:520px){.row{grid-template-columns:1fr}h1{font-size:1.8rem}}
</style></head><body><main>
<h1>Setwise</h1><div class="m">A rule-based workout planner. Same inputs, same plan, with a reason for every exercise.</div>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
/* ===== CONFIG (change weights/volumes without touching the engine) ===== */
const CFG={
 weights:{goal:3,compound:2,pref:4,history:2,variety:2,fit:1},
 sets:{beginner:3,intermediate:3,advanced:4},
 weeklyVolume:{beginner:{min:8,max:12},intermediate:{min:10,max:16},advanced:{min:12,max:20}}, // direct sets/muscle/week (guide)
 warmup:5,transition:0.5,secPerRep:3,
 splits:{2:['Full Body A','Full Body B'],3:['Full Body A','Full Body B','Full Body C'],4:['Upper','Lower','Upper','Lower'],
  5:['Upper','Lower','Push','Pull','Legs'],6:['Push','Pull','Legs','Push','Pull','Legs']}
};
/* ===== EXERCISE DB: id,name,muscle,sec,pattern,equip,diff(1-3),compound,group,reps,rest(s) ===== */
const E=(id,n,m,s,p,eq,d,c,g,r,rs,loc='both')=>({id,name:n,muscle:m,sec:s,pattern:p,equip:eq,diff:d,compound:c,group:g,reps:r,rest:rs,loc});
const DB=[
E('sq','Barbell Back Squat','quads',['glutes'],'squat',['barbell'],2,1,'squat',[5,8],150,'gym'),
E('gs','Goblet Squat','quads',['glutes'],'squat',['dumbbell'],1,1,'squat',[8,12],90),
E('bs','Bodyweight Squat','quads',['glutes'],'squat',[],1,1,'squat',[12,20],60),
E('lp','Leg Press','quads',['glutes'],'squat',['machine'],1,1,'squat',[8,12],120,'gym'),
E('rdl','Romanian Deadlift','hamstrings',['glutes'],'hinge',['barbell'],2,1,'hinge',[6,10],120),
E('dbrdl','Dumbbell RDL','hamstrings',['glutes'],'hinge',['dumbbell'],1,1,'hinge',[8,12],90),
E('gb','Glute Bridge','glutes',['hamstrings'],'hinge',[],1,1,'hinge',[10,15],60),
E('hc','Leg Curl','hamstrings',[],'isolation',['machine'],1,0,'hamcurl',[10,15],75,'gym'),
E('wl','Walking Lunge','quads',['glutes'],'lunge',['dumbbell'],2,1,'lunge',[8,12],90),
E('rl','Reverse Lunge (bodyweight)','quads',['glutes'],'lunge',[],1,1,'lunge',[10,15],60),
E('le','Leg Extension','quads',[],'isolation',['machine'],1,0,'legext',[10,15],75,'gym'),
E('cr','Standing Calf Raise','calves',[],'isolation',['dumbbell'],1,0,'calf',[12,20],60),
E('cr0','Bodyweight Calf Raise','calves',[],'isolation',[],1,0,'calf',[15,25],45),
E('bp','Barbell Bench Press','chest',['triceps','shoulders'],'hpush',['barbell'],2,1,'hpress',[5,8],150,'gym'),
E('dbp','Dumbbell Bench Press','chest',['triceps','shoulders'],'hpush',['dumbbell'],1,1,'hpress',[8,12],105),
E('fp','Dumbbell Floor Press','chest',['triceps'],'hpush',['dumbbell'],1,1,'hpress',[8,12],90),
E('pu','Push-up','chest',['triceps','shoulders'],'hpush',[],1,1,'hpress',[8,15],75),
E('idp','Incline Dumbbell Press','chest',['shoulders','triceps'],'hpush',['dumbbell'],2,1,'hpress',[8,12],105),
E('cf','Cable Fly','chest',[],'isolation',['cable'],2,0,'chestfly',[10,15],60,'gym'),
E('ohp','Overhead Press','shoulders',['triceps'],'vpush',['barbell'],2,1,'vpress',[5,8],120,'gym'),
E('dop','Dumbbell Shoulder Press','shoulders',['triceps'],'vpush',['dumbbell'],1,1,'vpress',[8,12],90),
E('pk','Pike Push-up','shoulders',['triceps'],'vpush',[],2,1,'vpress',[6,12],75),
E('lr','Lateral Raise','shoulders',[],'isolation',['dumbbell'],1,0,'latraise',[12,20],60),
E('tp','Triceps Pushdown','triceps',[],'isolation',['cable'],1,0,'tri',[10,15],60,'gym'),
E('ske','Dumbbell Overhead Extension','triceps',[],'isolation',['dumbbell'],1,0,'tri',[10,15],60),
E('dip','Bench Dip','triceps',['chest'],'isolation',[],1,0,'tri',[8,15],60),
E('lat','Lat Pulldown','back',['biceps'],'vpull',['cable'],1,1,'vpull',[8,12],90,'gym'),
E('pul','Pull-up','back',['biceps'],'vpull',['pullup bar'],3,1,'vpull',[5,10],120),
E('bro','Barbell Row','back',['biceps'],'hpull',['barbell'],2,1,'hrow',[6,10],120,'gym'),
E('dbr','One-arm Dumbbell Row','back',['biceps'],'hpull',['dumbbell'],1,1,'hrow',[8,12],75),
E('cbr','Seated Cable Row','back',['biceps'],'hpull',['cable'],1,1,'hrow',[8,12],90,'gym'),
E('bor','Resistance Band Row','back',['biceps'],'hpull',['bands'],1,1,'hrow',[10,15],60),
E('fpl','Face Pull','shoulders',['back'],'hpull',['cable'],1,0,'rear',[12,20],60,'gym'),
E('rdf','Dumbbell Rear Delt Fly','shoulders',['back'],'isolation',['dumbbell'],1,0,'rear',[12,20],60),
E('bc','Dumbbell Curl','biceps',[],'isolation',['dumbbell'],1,0,'bi',[8,12],60),
E('cc','Cable Curl','biceps',[],'isolation',['cable'],1,0,'bi',[10,15],60,'gym'),
E('bdc','Band Curl','biceps',[],'isolation',['bands'],1,0,'bi',[10,15],60),
E('pl','Plank','core',[],'core',[],1,0,'corestat',[30,60],45),
E('cru','Crunch','core',[],'core',[],1,0,'corecrunch',[12,20],45),
E('hlr','Hanging Knee Raise','core',[],'core',['pullup bar'],2,0,'corecrunch',[8,15],60),
E('fc','Farmer Carry','core',['back'],'carry',['dumbbell'],1,0,'carry',[30,45],60)
];
const MUSCLES=['quads','hamstrings','glutes','chest','back','shoulders','biceps','triceps','calves','core'];
const EQUIP=['barbell','dumbbell','machine','cable','pullup bar','bands'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYFOCUS={ // muscles + per-muscle exercise slots
 'Full Body':{quads:1,hamstrings:1,chest:1,back:1,shoulders:1,core:1,biceps:1,triceps:1},
 Upper:{chest:2,back:2,shoulders:1,biceps:1,triceps:1,core:1},
 Lower:{quads:2,hamstrings:2,glutes:1,calves:1,core:1},
 Push:{chest:2,shoulders:2,triceps:2},Pull:{back:3,shoulders:1,biceps:2,core:1},
 Legs:{quads:2,hamstrings:2,glutes:1,calves:1,core:1}};
/* ===== STATE ===== */
const defP={goal:'general',exp:'beginner',loc:'home',equip:['dumbbell'],days:['Mon','Wed','Fri'],mins:45,excl:'',pref:'',swaps:{},weights:{}};
let S={profile:defP,plan:null,history:[],week:1,reasons:{}};
try{const x=localStorage.getItem('setwise');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('setwise',JSON.stringify(S))}catch(e){}};
/* ===== ENGINE ===== */
const names=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
function validate(p){const e=[];if(!p.days.length)e.push('Pick at least one training day.');if(p.mins<15)e.push('Minimum session length is 15 minutes.');if(p.loc!=='gym'&&!p.equip.length&&false)e.push('');return e}
function eligible(p){ // filter step
 const ex=names(p.excl),eq=new Set(p.equip),maxD={beginner:2,intermediate:3,advanced:3}[p.exp];
 return DB.filter(x=>x.equip.every(q=>eq.has(q))&&x.diff<=maxD&&(p.loc==='both'||x.loc==='both'||x.loc===p.loc)&&!ex.some(n=>x.name.toLowerCase().includes(n))&&!(p.swaps[x.id]&&p.swaps[x.id]==='never'));
}
function score(x,p,used){ // rank step; returns [score, reasons]
 const w=CFG.weights,r=[];let s=0;
 const g=p.goal;if(x.compound){s+=w.compound;r.push('compound lift')}
 if((g==='muscle'||g==='recomp')&&x.reps[0]<=10){s+=w.goal;r.push('suits muscle gain')}
 if(g==='fat'&&x.compound){s+=w.goal;r.push('high energy cost for fat loss')}
 if(g==='general'&&x.diff===1){s+=w.goal*.6}
 if(names(p.pref).some(n=>x.name.toLowerCase().includes(n))){s+=w.pref;r.push('you prefer it')}
 const h=(p.weights[x.id]||0);s+=h*w.history;if(h>0)r.push('went well before');if(h<0)r.push('you struggled with it');
 if(used.has(x.group))s-=99;if(!used.has(x.id))s+=w.variety*(S.recent&&S.recent.includes(x.id)?0:1);
 s+=w.fit*(x.equip.length===0?.5:1);
 return[s,r]}
function build(day,p,pool,usedWeek){
 const base=day.replace(/ [ABC]$/,''),slots=DAYFOCUS[base],picks=[],used=new Set();
 const order=Object.keys(slots).sort((a,b)=>(slots[b]||0)-(slots[a]||0));
 const cand=[];
 for(const m of Object.keys(slots))for(let i=0;i<slots[m];i++){
  const opts=pool.filter(x=>x.muscle===m&&!used.has(x.group)).map(x=>{const[s,r]=score(x,p,used);return{x,s:s-(usedWeek.has(x.id)&&day.includes('Full')?0:0)+(x.compound?(i===0?1.5:0):-(i)*.3),r}}).sort((a,b)=>b.s-a.s||a.x.id.localeCompare(b.x.id));
  if(opts[0]){used.add(opts[0].x.group);cand.push({...opts[0],prio:(opts[0].x.compound?10:3)-i+(m==='core'?-2:0)})}
 }
 cand.sort((a,b)=>b.prio-a.prio);
 const sets=CFG.sets[p.exp];
 return cand.map(c=>{const x=c.x,iso=!x.compound;return{id:x.id,name:x.name,muscle:x.muscle,sets:iso?Math.max(2,sets-1):sets,reps:x.reps,rest:x.rest,prio:c.prio,why:[x.muscle+' / '+x.pattern].concat(c.r).join(' · ')}});
}
const exTime=e=>{const work=(e.reps[1]>=30?e.reps[1]:e.reps[1]*CFG.secPerRep)/60;return e.sets*(work+(e.rest*(e.ss?.5:1))/60)+CFG.transition};
function fit(list,p){ // time optimizer
 const cap=p.mins,total=l=>CFG.warmup+l.reduce((a,e)=>a+exTime(e),0);
 let l=list.map(e=>({...e}));
 // 1: trim rest 15% on isolations
 if(total(l)>cap)l.forEach(e=>{if(!/squat|hinge/.test(e.pattern||'')&&e.prio<8)e.rest=Math.round(e.rest*.85)});
 // 2: pair isolation/isolation of opposing muscles as supersets
 if(total(l)>cap)superset(l);
 // 3: drop lowest priority until it fits (keep >=2)
 while(total(l)>cap&&l.length>2){const i=l.reduce((m,e,j)=>e.prio<l[m].prio?j:m,0);l.splice(i,1)}
 // 4: reduce sets as a last resort
 while(total(l)>cap&&l.some(e=>e.sets>2)){const e=l.find(e=>e.sets>2);e.sets--}
 return{items:l,mins:Math.round(total(l))}}
const OPP={chest:'back',back:'chest',biceps:'triceps',triceps:'biceps',quads:'hamstrings',hamstrings:'quads'};
function superset(l){let n=1;for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];
 if(a.ss||b.ss||a.prio>=8||b.prio>=8&&false)continue;
 if((OPP[a.muscle]===b.muscle||b.muscle==='core')&&a.prio<8&&b.prio<8){a.ss=b.ss='S'+n++;}}}
function generate(p){
 const errs=validate(p);if(errs.length)return{errs};
 const n=Math.min(6,Math.max(2,p.days.length)),split=CFG.splits[n],pool=eligible(p),usedWeek=new Set(),out=[];
 const days=DAYS.filter(d=>p.days.includes(d)).slice(0,n);
 days.forEach((d,i)=>{const name=split[i],pri=build(name,p,pool,usedWeek);
  // rotate variants for repeated day types so A/B differ
  const f=fit(pri,p);out.push({day:d,name,mins:f.mins,items:f.items})});
 return{plan:out}}
/* ===== SUBSTITUTION ===== */
function alternatives(id,p){const x=DB.find(e=>e.id===id),inPlan=new Set(S.plan.flatMap(d=>d.items.map(i=>i.id)));
 return eligible(p).filter(e=>e.id!==id&&e.muscle===x.muscle&&!inPlan.has(e.id)).map(e=>({e,s:(e.pattern===x.pattern?4:0)+(e.compound===x.compound?2:0)+(e.group===x.group?3:0)-Math.abs(e.diff-x.diff)+score(e,p,new Set())[0]*.1})).sort((a,b)=>b.s-a.s).slice(0,4).map(a=>a.e)}
/* ===== PROGRESSION (double progression) ===== */
function target(id){const h=S.history.filter(s=>s.exs[id]).slice(-1)[0],x=DB.find(e=>e.id===id);
 if(!h)return null;const r=h.exs[id],lo=x.reps[0],hi=x.reps[1],done=r.sets.filter(s=>s.reps>0);
 if(!done.length)return{txt:'Repeat last session.'};
 const minR=Math.min(...done.map(s=>s.reps)),w=Math.max(...done.map(s=>s.w||0)),step=x.equip.includes('barbell')?2.5:2;
 if(minR>=hi&&done.length>=r.planned)return{w:w+step,txt:`Hit ${hi} reps on every set. Go to ${w+step} kg and aim for ${lo}.`};
 if(minR<lo&&r.rpe>=9)return{w:Math.max(0,w-step),txt:`Missed the low end. Hold or drop to ${Math.max(0,w-step)} kg.`};
 return{w,txt:`Keep ${w} kg and try for ${Math.min(hi,minR+1)}+ reps per set.`}}
function adapt(){ // weekly adaptation from last session set
 const wk=S.history.filter(s=>s.week===S.week);if(!wk.length)return'Log a workout to see weekly adaptation.';
 const comp=wk.reduce((a,s)=>a+s.done/s.total,0)/wk.length,rpe=wk.reduce((a,s)=>a+s.rpe,0)/wk.length,planned=S.plan?S.plan.length:1;
 const rate=wk.length/planned;
 let msg=`Week ${S.week}: ${Math.round(rate*100)}% of sessions, ${Math.round(comp*100)}% of sets completed, average RPE ${rpe.toFixed(1)}. `;
 if(comp>=.9&&rpe<=8.5)msg+='Good completion with manageable effort, so loads progress as targets suggest.';
 else if(comp<.7||rpe>9)msg+='Completion or effort is off. Next week keeps loads and trims one set from accessories.';
 else msg+='Steady week. Keep current loads.';
 return msg}
function nextWeek(){const wk=S.history.filter(s=>s.week===S.week);
 wk.forEach(s=>Object.entries(s.exs).forEach(([id,r])=>{const done=r.sets.filter(x=>x.reps>0).length/r.planned;S.profile.weights[id]=Math.max(-2,Math.min(3,(S.profile.weights[id]||0)+(done>=1&&r.rpe<9?1:done<.6?-1:0)))}));
 const bad=wk.length&&wk.reduce((a,s)=>a+s.done/s.total,0)/wk.length<.7;
 S.recent=S.plan.flatMap(d=>d.items.map(i=>i.id));
 const r=generate(S.profile);if(r.plan){S.plan=r.plan;if(bad)S.plan.forEach(d=>d.items.forEach(i=>{if(i.prio<8&&i.sets>2)i.sets--}))}
 S.week++;save()}
/* ===== UI ===== */
let tab='plan',logging=null;
const $=s=>document.querySelector(s),H=(s)=>$('#v').innerHTML=s;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nav(){$('#nav').innerHTML=[['profile','Profile'],['plan','This week'],['history','Progress']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){tab=t;logging=null;nav();({profile:vProfile,plan:vPlan,history:vHist})[t]()}
function chips(name,opts,sel,multi){return`<div class="chips">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return`<button type="button" class="${(multi?sel.includes(v):sel===v)?'on':''}" onclick="pick('${name}','${v}',${multi})">${l}</button>`}).join('')}</div>`}
function pick(k,v,multi){const p=S.profile;syncText();if(multi){const a=p[k],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)}else p[k]=v;vProfile()}
function syncText(){const m=$('#mins'),x=$('#excl'),f=$('#pref');if(m){S.profile.mins=+m.value||45;S.profile.excl=x.value;S.profile.pref=f.value}}
function vProfile(){const p=S.profile;H(`<div class="card"><h2>Your training setup</h2>
<label>Goal</label>${chips('goal',[['fat','Fat loss'],['muscle','Muscle gain'],['recomp','Recomposition'],['general','General fitness']],p.goal)}
<label>Experience</label>${chips('exp',[['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced']],p.exp)}
<label>Where do you train?</label>${chips('loc',[['home','Home'],['gym','Gym'],['both','Both']],p.loc)}
<label>Equipment you have (bodyweight is always included)</label>${chips('equip',EQUIP,p.equip,true)}
<label>Training days</label>${chips('days',DAYS,p.days,true)}
<div class="row"><div><label for="mins">Max session length (minutes)</label><input id="mins" type="number" min="15" max="120" value="${p.mins}"></div></div>
<label for="excl">Exercises to never use (comma-separated)</label><input id="excl" type="text" value="${esc(p.excl)}" placeholder="e.g. lunge, pull-up">
<label for="pref">Exercises you prefer</label><input id="pref" type="text" value="${esc(p.pref)}" placeholder="e.g. push-up, row">
<p class="note">Setwise is not medical advice. If you have an injury or health condition, check with a professional before training and exclude any movement that bothers you.</p>
<button class="pri" onclick="make()">Generate my plan</button></div>`)}
function make(){syncText();const r=generate(S.profile);if(r.errs){alert(r.errs.join('\n'));return}S.plan=r.plan;S.week=S.week||1;S.recent=[];save();go('plan')}
function vPlan(){if(!S.plan)return H(`<div class="card"><h2>No plan yet</h2><p>Fill in your profile and generate a weekly plan.</p><button class="pri" onclick="go('profile')">Set up profile</button></div>`);
 if(logging!==null)return vLog(logging);
 H(`<div class="card"><b>Week ${S.week}</b> <span class="m">· ${S.plan.length} sessions · capped at ${S.profile.mins} min</span><p class="m">${esc(adapt())}</p><button class="sm" onclick="if(confirm('Close this week and adapt next week?')){nextWeek();vPlan()}">Finish week and adapt</button></div>`+
 S.plan.map((d,di)=>`<div class="card"><div class="t" style="display:flex;justify-content:space-between"><h3>${d.day}: ${d.name}</h3><span class="m">~${d.mins} min (incl. ${CFG.warmup} min warm-up)</span></div>${d.items.map((e,ei)=>{const t=target(e.id);return`<div class="ex ${e.ss?'ss':''}"><div class="t"><b>${esc(e.name)}</b><span>${e.sets} × ${e.reps[0]}${e.reps[1]>e.reps[0]?'–'+e.reps[1]:''}${e.reps[1]>=30?'s':''} · rest ${e.rest}s${e.ss?' · superset '+e.ss:''}</span></div><div class="m">${esc(e.why)}</div>${t?`<div class="m"><b>Next:</b> ${esc(t.txt)}</div>`:''}<div style="margin-top:6px;display:flex;gap:6px"><button class="sm" onclick="repl(${di},${ei})">Replace</button><button class="sm" onclick="rem(${di},${ei})">Remove</button></div></div>`}).join('')}<button class="pri" style="margin-top:8px" onclick="startLog(${di})">Start workout</button></div>`).join(''))}
function rem(d,i){S.plan[d].items.splice(i,1);save();vPlan()}
function repl(d,i){const e=S.plan[d].items[i],alts=alternatives(e.id,S.profile);
 const why=prompt(`Why replace ${e.name}? (equipment / dislike / too hard / too easy / uncomfortable / other)`,'dislike');if(why===null)return;
 S.profile.weights[e.id]=(S.profile.weights[e.id]||0)-(/hard|dislike|uncomfortable/.test(why)?1:0);
 if(/equipment/.test(why))S.profile.swaps[e.id]='never';
 if(!alts.length){alert('No equivalent exercise fits your equipment and exclusions.');return}
 const c=prompt('Pick a replacement:\n'+alts.map((a,k)=>`${k+1}. ${a.name} (${a.pattern})`).join('\n'),'1');const a=alts[(+c||0)-1];if(!a)return;
 S.plan[d].items[i]={...e,id:a.id,name:a.name,reps:a.reps,rest:a.rest,why:`${a.muscle} / ${a.pattern} · replaces ${e.name} (${why})`};save();vPlan()}
function startLog(d){logging=d;vPlan()}
function vLog(d){const day=S.plan[d];H(`<div class="card"><h2>${day.day}: ${day.name}</h2>${day.items.map((e,ei)=>{const t=target(e.id),last=S.history.filter(s=>s.exs[e.id]).slice(-1)[0];const w0=t&&t.w!=null?t.w:(last?Math.max(...last.exs[e.id].sets.map(s=>s.w||0)):'');return`<div class="ex"><b>${esc(e.name)}</b> <span class="m">${e.sets} × ${e.reps[0]}–${e.reps[1]}</span>${t?`<div class="m">${esc(t.txt)}</div>`:''}<div class="sets">${Array.from({length:e.sets},(_,s)=>`<span>Set ${s+1}<br><input type="number" id="w${ei}_${s}" placeholder="kg" value="${w0}" aria-label="weight"> <input type="number" id="r${ei}_${s}" placeholder="reps" aria-label="reps"></span>`).join('')}<span>RPE<br><input type="number" id="p${ei}" min="1" max="10" value="8"></span></div></div>`}).join('')}
<button class="pri" onclick="finish(${d})">Save workout</button> <button onclick="go('plan')">Cancel</button></div>`)}
function finish(d){const day=S.plan[d],exs={};let done=0,total=0,rp=0;
 day.items.forEach((e,ei)=>{const sets=[];for(let s=0;s<e.sets;s++){const r=+$('#r'+ei+'_'+s).value||0,w=+$('#w'+ei+'_'+s).value||0;sets.push({reps:r,w});total++;if(r>0)done++}
  const rpe=+$('#p'+ei).value||8;rp+=rpe;exs[e.id]={name:e.name,planned:e.sets,sets,rpe}});
 S.history.push({date:new Date().toISOString().slice(0,10),week:S.week,day:day.name,exs,done,total,rpe:rp/day.items.length});save();go('history')}
function vHist(){if(!S.history.length)return H(`<div class="card"><h2>No workouts logged</h2><p>Start a workout from your weekly plan to record sets, reps, weight and RPE.</p></div>`);
 H(`<div class="card"><h2>Progress</h2><p class="m">${esc(adapt())}</p><div class="bar"><i style="width:${Math.round(100*S.history.reduce((a,s)=>a+s.done,0)/S.history.reduce((a,s)=>a+s.total,0))}%"></i></div><div class="m">Overall set completion</div></div>`+
 S.history.slice().reverse().map(s=>`<div class="card"><b>${s.date} · ${esc(s.day)}</b> <span class="m">week ${s.week} · ${s.done}/${s.total} sets · avg RPE ${s.rpe.toFixed(1)}</span><table>${Object.values(s.exs).map(r=>`<tr><td>${esc(r.name)}</td><td>${r.sets.map(x=>x.reps?x.w+'×'+x.reps:'–').join(', ')}</td></tr>`).join('')}</table></div>`).join(''))}
nav();go(S.plan?'plan':'profile');
</script></body></html>
